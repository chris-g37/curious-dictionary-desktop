<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Curious Dictionary</title>
    <link rel="stylesheet" href="bar.css" />
  </head>
  <body>
    <div id="app">
      <div id="pill">
        <svg id="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2" />
          <line x1="15.3" y1="15.3" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <input
          id="search-input"
          type="text"
          placeholder="Look up a word…"
          autocomplete="off"
          spellcheck="false"
        />
        <span id="esc-hint">esc to close</span>
      </div>
      <div id="selection-hint"></div>
      <div id="result"></div>
      <div id="history"></div>
      <div id="bar-credit">
        <span class="bar-credit-pill">
          by <a id="bar-credit-link" href="https://services.fetchmate.tech">Fetchmate Chief Technologies</a>
        </span>
      </div>
    </div>
    <script src="bar.js"></script>
  </body>
</html>
