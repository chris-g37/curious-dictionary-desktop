<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Curious Dictionary Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <div id="settings">
      <h1>Settings</h1>

      <section class="field">
        <label for="api-key">Merriam-Webster API key</label>
        <div class="input-row">
          <input
            id="api-key"
            type="password"
            placeholder="Paste your API key"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="toggle-key-visibility" type="button" aria-label="Show key">
            <svg id="eye-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linejoin="round"
              />
              <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
              <line
                id="eye-slash"
                x1="3"
                y1="3"
                x2="21"
                y2="21"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                visibility="hidden"
              />
            </svg>
          </button>
        </div>
        <a id="get-key-link" href="#">Get a free key</a>
        <span id="key-status" class="status"></span>
      </section>

      <section class="field">
        <label>Theme</label>
        <div class="theme-picker" role="radiogroup" aria-label="Theme">
          <button class="theme-option" data-theme="light" type="button">Light</button>
          <button class="theme-option" data-theme="dark" type="button">Dark</button>
          <button class="theme-option" data-theme="system" type="button">System</button>
        </div>
      </section>

      <section class="field">
        <label>History</label>
        <div class="input-row">
          <button id="clear-history" type="button">Clear history</button>
          <span id="clear-status" class="status"></span>
        </div>
      </section>

      <section class="field">
        <label>Keyboard shortcuts</label>
        <div class="shortcut-row">
          <span>Show search bar</span>
          <kbd>Ctrl+Shift+Space</kbd>
        </div>
        <div class="shortcut-row">
          <span>Look up selected word</span>
          <kbd>Ctrl+Shift+D</kbd>
        </div>
        <p class="shortcut-note">Custom shortcuts are coming in a future update.</p>
      </section>
    </div>
    <script src="settings.js"></script>
  </body>
</html>
